{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block header_title %}📅 {{ titulo }}{% endblock %}

{% block content %}
{% if flash_msg %}
<div class="flash flash-{{ flash_type }}">{{ flash_msg }}</div>
{% endif %}

<div class="card" style="max-width:680px;">
  <form method="post" action="/turnos/{% if turno %}{{ turno.id }}/editar{% else %}nuevo{% endif %}">
    
    <!-- Cliente -->
    <div class="form-group">
      <label class="form-label">👤 Cliente</label>
      <select name="cliente_id" class="form-control" id="selectCliente">
        <option value="">— Sin cliente asignado —</option>
        {% for c in clientes %}
        <option value="{{ c.id }}"
          {% if turno and turno.cliente_id == c.id %}selected
          {% elif not turno and request.query_params.get('cliente_id') == c.id|string %}selected
          {% endif %}>
          {{ c.nombre }} {% if c.telefono %}({{ c.telefono }}){% endif %}
        </option>
        {% endfor %}
      </select>
    </div>

    <!-- Servicios -->
    <div class="form-group">
      <label class="form-label">✂️ Servicios del turno</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.4rem .75rem;max-height:180px;overflow-y:auto;padding:.5rem;border:1px solid var(--border);border-radius:8px;background:var(--bg);">
        {% for s in servicios %}
        <label style="display:flex;align-items:center;gap:.4rem;font-size:.85rem;cursor:pointer;">
          <input type="checkbox" name="servicios_ids" value="{{ s.id }}"
            {% if turno and s.id in turno._servicios_ids_list %}checked
            {% elif not turno and request.query_params.get('servicio_id') == s.id|string %}checked
            {% endif %}
            onchange="calcularDuracion()" style="accent-color:var(--primary);">
          <span>{{ s.nombre }}</span>
          <span style="color:var(--text-muted);font-size:.78rem;">({{ s.duracion_min }}min)</span>
        </label>
        {% endfor %}
      </div>
      <div id="duracionPreview" style="margin-top:.4rem;font-size:.82rem;color:var(--text-muted);"></div>
    </div>

    <!-- Fecha/Hora inicio y fin -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
      <div class="form-group">
        <label class="form-label">🕐 Inicio</label>
        <input type="datetime-local" name="fecha_hora_inicio" id="dtInicio"
               class="form-control"
               value="{% if turno %}{{ turno._inicio_ar_str }}{% elif datetime_default %}{{ datetime_default }}{% endif %}"
               oninput="actualizarFin()" required>
      </div>
      <div class="form-group">
        <label class="form-label">🕓 Fin</label>
        <input type="datetime-local" name="fecha_hora_fin" id="dtFin"
               class="form-control"
               value="{% if turno %}{{ turno._fin_ar_str }}{% endif %}"
               required>
      </div>
    </div>

    <!-- Estado -->
    <div class="form-group">
      <label class="form-label">Estado</label>
      <select name="estado" class="form-control">
        {% for e in estados %}
        <option value="{{ e }}" {% if turno and turno.estado == e %}selected{% elif not turno and e == 'pendiente' %}selected{% endif %}>
          {{ e|capitalize }}
        </option>
        {% endfor %}
      </select>
    </div>

    <!-- Notas -->
    <div class="form-group">
      <label class="form-label">Notas</label>
      <textarea name="notas" class="form-control" rows="2" placeholder="Notas internas sobre el turno...">{% if turno %}{{ turno.notas }}{% endif %}</textarea>
    </div>

    <div style="display:flex;gap:.75rem;">
      <button type="submit" class="btn btn-primary">
        {% if turno %}Guardar cambios{% else %}Crear turno{% endif %}
      </button>
      <a href="/turnos" class="btn btn-ghost">Cancelar</a>
      {% if turno %}
      <form action="/turnos/{{ turno.id }}/eliminar" method="post" style="margin-left:auto;"
            onsubmit="return confirm('¿Eliminar este turno?')">
        <button type="submit" class="btn btn-ghost" style="color:var(--danger);">🗑 Eliminar</button>
      </form>
      {% endif %}
    </div>
  </form>
</div>

<!-- Duraciones de servicios en JS -->
<script>
const duraciones = {
  {% for s in servicios %}
  {{ s.id }}: {{ s.duracion_min }},
  {% endfor %}
};

function calcularDuracion() {
  const checks = document.querySelectorAll('input[name="servicios_ids"]:checked');
  let total = 0;
  checks.forEach(c => { total += duraciones[parseInt(c.value)] || 0; });
  const el = document.getElementById('duracionPreview');
  if (total > 0) {
    const h = Math.floor(total/60), m = total % 60;
    el.textContent = `⏱ Duración total: ${h > 0 ? h+'h ' : ''}${m > 0 ? m+'min' : ''}`;
    actualizarFin();
  } else {
    el.textContent = '';
  }
}

function actualizarFin() {
  const inicio = document.getElementById('dtInicio').value;
  if (!inicio) return;
  const checks = document.querySelectorAll('input[name="servicios_ids"]:checked');
  let total = 0;
  checks.forEach(c => { total += duraciones[parseInt(c.value)] || 0; });
  if (total <= 0) total = 60; // default 1h si no hay servicios
  const dt = new Date(inicio);
  dt.setMinutes(dt.getMinutes() + total);
  // Formatear YYYY-MM-DDTHH:MM
  const pad = n => String(n).padStart(2,'0');
  const finStr = `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
  document.getElementById('dtFin').value = finStr;
}

// Calcular al cargar
calcularDuracion();
</script>
{% endblock %}
