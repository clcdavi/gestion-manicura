version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: salon-db
    restart: always
    environment:
      POSTGRES_USER: salon_admin
      POSTGRES_PASSWORD: cambiale_esta_clave_segura_123
      POSTGRES_DB: salon_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - salon-network

  app:
    build: .
    container_name: salon-app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://salon_admin:cambiale_esta_clave_segura_123@db:5432/salon_db
      - SESSION_SECRET=clave_secreta_para_sesiones_123
    depends_on:
      - db
    networks:
      - salon-network

networks:
  salon-network:
    driver: bridge

volumes:
  postgres_data:
